<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrupando colunas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;

        }
        caption{
            background-color: gray;
            color: white;
            font-weight: bolder;
            font-size: 1.3em;
        }
        th, td{
            border: 1px solid black;
            padding: 4px 8px;
        }
        .amarelo{
            background-color: yellow;
        }
        .azul{
            background-color: blue;
        }
    </style>
</head>
<body>
    <table>
        <colgroup>
            <col class="azul" span="2">
            <col class="amarelo" span="2">
        </colgroup>
        <caption>Agrupando Colunas</caption>
            <thead>
                <th scope="col">Nome</th>
                <th scope="col">Sexo</th>
                <th scope="col">Idade</th>
                <th scope="col">Profissão</th>
            </thead>
            <tbody>
                <tr>
                    <td>Ana Maria</td>
                    <td>F</td>
                    <td>55</td>
                    <td>Confeitera</td>
                </tr>
                <tr>
                    <td>João Paulo</td>
                    <td>M</td>
                    <td>27</td>
                    <td>Carpinteiro</td>
                </tr>
                <tr>
                    <td>Pedro Alves</td>
                    <td>M</td>
                    <td>17</td>
                    <td>Estudante</td>
                </tr>
                <tr>
                    <td>Camile Pereira</td>
                    <td>F</td>
                    <td>22</td>
                    <td>Recepcionista</td>
                </tr>
                <tr>
                    <td>Carol Carmen</td>
                    <td>F</td>
                    <td>25</td>
                    <td>Vendedora</td>
                </tr>
            </tbody>
    </table>
</body>
</html>
