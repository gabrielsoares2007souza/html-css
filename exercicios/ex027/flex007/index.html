<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex itens</title>
    <style>
        section{
            height: 300px;
            display: flex;
            flex-flow: row wrap;
            align-items: stretch;
            background-color: gray;
        }
        div{
            padding: 20px;
            border: 15px solid rgb(0, 255, 64);
            background-color: #886b6b;
            flex-basis: 250px;
            flex-grow: 1;
            flex-shrink: 1;
        }
    </style>
</head>
<body>
    <main>
        <h1>Tamanho de itens flexiveis - flex grow e shrink</h1>
        <section>
            <div id="item1">1</div>
            <div id="item2">2</div>
            <div id="item3">3</div>
        </section>
    </main>
</body>
</html>
