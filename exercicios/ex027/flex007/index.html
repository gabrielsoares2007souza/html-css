<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex itens</title>
    <style>
        section{
            height: 300px;
            display: flex;
            align-items: flex-start;
            background-color: gray;
        }
        div{
            padding: 20px;
            border: 1px solid black;
            background-color: rgb(136, 107, 107);
        }
    </style>
</head>
<body>
    <main>
        <section>
            <div id="item1">1</div>
            <div id="item2">2</div>
            <div id="item3">3</div>
            <div id="item4">4</div>
            <div id="item5">5</div>
            <div id="item6">6</div>
            <div id="item7">7</div>
            <div id="item8">8</div>
        </section>
    </main>
</body>
</html>
