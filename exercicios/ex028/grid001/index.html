<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid layout</title>
    <style>
        #conteiner{
            background-color: rgb(77, 77, 77);
            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto auto ;
            gap: 20px;
            height: 200px;
        }
        .itens{
            background-color: rgb(168, 168, 168);
        }
    </style>
</head>
<body>
    <main id="conteiner">
        <div class="itens"></div>
        <div class="itens"></div>
        <div class="itens"></div>
        <div class="itens"></div>
        <div class="itens"></div>
        <div class="itens"></div>
        <div class="itens"></div>
        <div class="itens"></div>
        <div class="itens"></div>
    </main>
</body>
</html>
