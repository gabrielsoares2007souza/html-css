<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid itens propriedades</title>
    <style>
        main.conteiner{
            background-color: lightpink;
            display: grid;
            gap: 10px;
            grid-template: repeat(3,100px)/ repeat(4, 1fr);
            padding: 10px;
        }
        div#c1{
            grid-area: 1 / 1 / 2 / span 4;
            background-color: rgb(253, 20, 20);
            text-align: center;
        }
        div#c2{
            grid-area: 2 / 1 / span 2 / span 2;
            background-color: rgb(255, 0, 200);
            text-align: center;
        }
        div#c3{
            grid-area: 2 / 3 / span 2 / span 2;
            background-color: rgb(43, 255, 0);
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="conteiner">
        <div class="itens" id="c1">1</div>
        <div class="itens" id="c2">2</div>
        <div class="itens" id="c3">3</div>
    </main>
</body>
</html>
