<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulários</title>
</head>
<body>
    <h1>
        Praticando formulários
    </h1>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Similique velit delectus aspernatur consequatur quaerat eius perferendis neque, corrupti placeat illum distinctio eos est omnis soluta ea saepe tenetur. Assumenda, voluptatum.</p>
    <br>
    <form action="cadastro.php" method="get" autocomplete="on">
            <p>
                <label for="iemail">email:</label>
                <input type="email" name="email" id="iemail" autocomplete="email" required>
            </p>
            <p>
                <label for="itel">telefone:</label>
                <input type="tel" name="tel" id="itel" autocomplete="tel-national" placeholder="(xx) x xxxx xxxx" required pattern="^\(\d{2}\)\d{4,5}-\d{4}$">
            </p>
            <p>
                <input type="submit" value="enviar">
                <input type="reset" value="apagar">
            </p>
</body>
</html>
