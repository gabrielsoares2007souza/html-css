<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulários</title>
</head>
<body>
    <h1>Teste com Formulários</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Nome Completo" autocomplete="name">
        </p>
        <p>
            <label for="imedia">Média:</label>
            <input type="number" name="media" id="imedia" required min="0" max="10" step="0.1" placeholder="Média do aluno">
        </p>
        <p>
            <label for="imes">Mês da atividade:</label>
            <input type="month" name="mes" id="imes"  required value="2025-02" >
        </p>
        <p>
            <label for="idata">Data:</label>
            <input type="date" name="data" id="idata" required value="2025-02-06">
        </p>
        <p>
            <label for="ihor">Horário da atividade:</label>
            <input type="time" name="hor" id="ihor" required >
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
