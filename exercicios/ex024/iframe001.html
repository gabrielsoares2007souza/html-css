<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo sobre Iframe</title>
    <style>
        iframe{
            border: 3px solid black;
            width: 500px;
            height: 400px;
            box-shadow: 0px 0px 10px 0px black;
        }
    </style>
</head>
<body>
    <H1> Iframes</H1>
    <p>Olhe o repositório do professor gustavo guanabara</p> 
    <iframe src="https://gustavoguanabara.github.io" frameborder="0" scolling="no"> <!--O valor NO do parâmetro scolling não pega em todos os navegadores, no Edge ele não funcionou e nem no Chrome--> </iframe>
    </iframe>
</body>
</html>
