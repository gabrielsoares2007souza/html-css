<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 13</title>
    <style>
        table{
            width: 300px;
            height: 150px;
            border-collapse: collapse;
        }
        table td{
            border: 1px solid black;
            text-align: center;
            text-transform: uppercase;
        }
        table caption{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-weight: bolder;
            font-variant: small-caps;
        }
        table td:nth-child(even){
            background-color: bisque;
        }
        table td:nth-child(odd){
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <table>
        <caption>Resolvendo desafio 1 </caption>
        <tr>
            <td>1</td>
            <td>2</td>
            <td rowspan="2">3</td>
            <td>4</td>
        </tr>
        <tr>
            <td>5</td>
            <td>6</td>
            <td>7</td>
        </tr>
        <tr>
            <td colspan="3">8</td>
            <td>9</td>
        </tr>
        <tr>
            <td rowspan="2">10</td>
            <td colspan="2">11</td>
            <td>12</td>
        </tr>
        <tr>
            <td>13</td>
            <td>14</td>
            <td>15</td>
        </tr>
    </table>
    <br>
    <table>
        <caption>Resolvendo desafio 2</caption>
        <tr>
            <td colspan="4">a</td>
            <td rowspan="4">b</td>
        </tr>
        <tr>
            <td rowspan="4">c</td>
            <td>d</td>
            <td>e</td>
            <td>f</td>
        </tr>
        <tr>
            <td>g</td>
            <td>h</td>
            <td>i</td>
        </tr>
        <tr>
            <td>j</td>
            <td>l</td>
            <td>m</td>
        </tr>
        <tr>
            <td colspan="4">n</td>
        </tr>
    </table>
</body>
</html>
