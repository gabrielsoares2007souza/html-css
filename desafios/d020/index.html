<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio - grid layout</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .conteiner{
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template: 100px 40px 1fr 40px / 3fr 1fr;
            gap: 5px;
        }
        .caixa{
            background-color: lightgrey;
            padding: 10px;
            text-align: center;
            border: 1px solid black;
        }
        #topo{
            grid-area: 1 / 1 / 2 / -1;
        }
        #menu{
            grid-area: 2 / 1  / 3 / -1;
        }
        #principal{
            grid-area: 3 / 1 / -2 / -2 ;
        }
        #secundario{
            grid-area: 3 / 2 / -2 / -1;
        }
        #rodape{
            grid-area: -2 / 1 / -1 / -1;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <header class="caixa" id="topo">topo</header>
        <nav class="caixa" id="menu">menu</nav>
        <article class="caixa" id="principal">principal</article>
        <aside class="caixa" id="secundario">secundario</aside>
        <footer class="caixa" id="rodape">rodape</footer>
    </div>
</body>
</html>
